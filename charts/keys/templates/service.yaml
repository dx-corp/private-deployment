apiVersion: v1
kind: Service
metadata:
  name: {{ include "keys.fullname" . }}
  labels:
    {{- include "keys.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    # Plaintext health/observability port so /metrics (and probes) stay
    # reachable through the Service when the http port enforces mutual TLS.
    - port: {{ .Values.health.port }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "keys.selectorLabels" . | nindent 4 }}
