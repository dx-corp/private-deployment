{{- if not .Values.secret.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keys.fullname" . }}
  labels:
    {{- include "keys.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
