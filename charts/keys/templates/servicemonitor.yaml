{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "keys.fullname" . }}
  labels:
    {{- include "keys.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "keys.selectorLabels" . | nindent 6 }}
  endpoints:
    # Scrape the plaintext health/observability listener so metrics stay
    # reachable when the primary http port enforces mutual TLS.
    - port: health
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scheme: {{ .Values.serviceMonitor.scheme }}
{{- end }}
