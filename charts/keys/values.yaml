replicaCount: 2

image:
  repository: ghcr.io/dx-corp/platform/keys
  # Digest takes precedence over tag; requireDigest rejects mutable references.
  digest: ""
  requireDigest: false
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

health:
  # Plaintext port for liveness/readiness probes and /metrics. Kept separate
  # from the mutual-TLS data port (service.port) so probes and scrapers bypass
  # client-cert enforcement. The chart pins KEYS_HEALTH_ADDR to this port so the
  # binary's health listener and the `health` container port cannot drift, and
  # the Service exposes it so Prometheus can reach /metrics without mTLS.
  port: 8090

serviceMonitor:
  # Prometheus Operator ServiceMonitor scraping the plaintext health port so
  # /metrics is reachable even when the http port enforces mutual TLS.
  enabled: false
  labels: {}
  interval: 30s
  path: /metrics
  scheme: http

serviceAccount:
  create: true
  name: ""
  automount: false
  annotations: {}

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 64Mi

budget:
  max_cpu_limit: 500m
  max_memory_limit: 512Mi
  max_replicas: 3
  justification: "Safety-critical Go HTTP key-resolution service with required pgx storage and encrypted provider references."

env:
  KEYS_DATABASE_URL: ""
  KEYS_MASTER_KEY: ""
  KEYS_KMS_KEY_RESOURCE: ""
  KEYS_KMS_REQUEST_TIMEOUT: "5s"
  KEYS_ALLOW_LOCAL_KEY_WRAPPING: "false"
  KEYS_IDENTITY_INTROSPECTION_URL: ""

secret:
  existingSecretName: ""

# Both services must reference the same administrator-managed policy ConfigMap.
# Create it immutable; change its name and checksum for a policy rollout.
privateProviderEndpoints:
  enabled: false
  existingConfigMapName: ""
  rolloutChecksum: ""
