apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "audit.fullname" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "audit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secret.existingSecretName }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "audit.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "audit.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- if .Values.cloudSqlProxy.enabled }}
        - name: cloud-sql-proxy
          image: {{ include "audit.imageReference" (list .Values.cloudSqlProxy.image .Values.image.requireDigest) | quote }}
          imagePullPolicy: {{ .Values.cloudSqlProxy.image.pullPolicy }}
          args:
            {{- range .Values.cloudSqlProxy.args }}
            - {{ . | quote }}
            {{- end }}
            - {{ printf "--port=%v" .Values.cloudSqlProxy.port | quote }}
            - {{ required "cloudSqlProxy.instanceConnectionName is required when cloudSqlProxy.enabled=true" .Values.cloudSqlProxy.instanceConnectionName | quote }}
          ports:
            - name: cloudsql
              containerPort: {{ .Values.cloudSqlProxy.port }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.cloudSqlProxy.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.cloudSqlProxy.resources | nindent 12 }}
        {{- end }}
        - name: {{ .Chart.Name }}
          image: {{ include "audit.imageReference" (list .Values.image .Values.image.requireDigest) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "audit.fullname" . }}
            - secretRef:
                name: {{ include "audit.secretName" . }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.tls.server.enabled .Values.tls.identityClient.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.tls.identityClient.enabled }}
            - name: identity-client-mtls
              mountPath: {{ .Values.tls.identityClient.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.tls.server.enabled }}
            - name: audit-server-tls
              mountPath: {{ .Values.tls.server.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: health
              scheme: {{ .Values.livenessProbe.scheme }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: health
              scheme: {{ .Values.readinessProbe.scheme }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: health
              scheme: {{ .Values.startupProbe.scheme }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.tls.server.enabled .Values.tls.identityClient.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.tls.identityClient.enabled }}
        - name: identity-client-mtls
          secret:
            secretName: {{ required "tls.identityClient.secretName is required when tls.identityClient.enabled=true" .Values.tls.identityClient.secretName }}
        {{- end }}
        {{- if .Values.tls.server.enabled }}
        - name: audit-server-tls
          secret:
            secretName: {{ required "tls.server.secretName is required when tls.server.enabled=true" .Values.tls.server.secretName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
