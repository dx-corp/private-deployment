apiVersion: v1
kind: Service
metadata:
  name: {{ include "audit.fullname" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: health
      port: 8090
      targetPort: health
      protocol: TCP
  selector:
    {{- include "audit.selectorLabels" . | nindent 4 }}
