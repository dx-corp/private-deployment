replicaCount: 3

image:
  repository: ghcr.io/dx-corp/platform/llm-gateway
  # Digest takes precedence over tag; requireDigest rejects mutable references.
  digest: ""
  requireDigest: false
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  name: ""
  automount: false
  annotations: {}

livenessProbe:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  path: /readyz
  initialDelaySeconds: 3
  periodSeconds: 5

startupProbe:
  enabled: true
  path: /readyz
  failureThreshold: 30
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

budget:
  max_cpu_limit: 2000m
  max_memory_limit: 2Gi
  max_replicas: 10
  justification: "Managed inference gateway with provider clients, response cache, governance checks, and budget enforcement; cap matches current chart pending usage-based right-sizing."

podAnnotations: {}

featureFlags:
  enabled: false
  existingConfigMapName: ""
  mountPath: /var/run/evalops/feature-flags
  fileName: flags.json

configEnv:
  LLM_GATEWAY_ADDR: "0.0.0.0:8080"
  LLM_GATEWAY_ENVIRONMENT: "production"

env:
  LLM_GATEWAY_DATABASE_URL: ""
  # Legacy service URL fallbacks remain supported for upgrades. Prefer the
  # LLM_GATEWAY_* endpoint-specific names below for new installs.
  IDENTITY_URL: ""
  KEYS_URL: ""
  METER_URL: ""
  AUDIT_URL: ""
  LLM_GATEWAY_BEARER_TOKEN: ""
  LLM_GATEWAY_IDENTITY_INTROSPECTION_URL: ""
  LLM_GATEWAY_REQUIRED_SCOPE: "llm_gateway:invoke"
  LLM_GATEWAY_REJECT_BROAD_INFERENCE_SCOPES: "true"
  LLM_GATEWAY_IDENTITY_REQUEST_TIMEOUT: "5s"
  LLM_GATEWAY_IDENTITY_INTROSPECTION_CACHE_TTL: "45s"
  LLM_GATEWAY_KEYS_RESOLVE_URL: ""
  LLM_GATEWAY_KEYS_SERVICE_TOKEN: ""
  LLM_GATEWAY_KEYS_REQUEST_TIMEOUT: "5s"
  LLM_GATEWAY_PROVIDER_EXECUTION_ENABLED: "false"
  LLM_GATEWAY_PROVIDER_UPSTREAMS: ""
  LLM_GATEWAY_PROMPTS_RESOLVE_URL: ""
  LLM_GATEWAY_PROMPTS_SERVICE_TOKEN: ""
  LLM_GATEWAY_PROMPTS_REQUEST_TIMEOUT: "5s"
  LLM_GATEWAY_GOVERNANCE_EVALUATE_URL: ""
  LLM_GATEWAY_GOVERNANCE_SERVICE_TOKEN: ""
  LLM_GATEWAY_GOVERNANCE_REQUEST_TIMEOUT: "5s"
  LLM_GATEWAY_AUDIT_EVENTS_URL: ""
  LLM_GATEWAY_AUDIT_SERVICE_TOKEN: ""
  LLM_GATEWAY_AUDIT_REQUEST_TIMEOUT: "2s"
  LLM_GATEWAY_AUDIT_BODY_CAPTURE_ENABLED: "false"
  LLM_GATEWAY_AUDIT_BODY_CAPTURE_ORG_IDS: ""
  LLM_GATEWAY_AUDIT_BODY_CAPTURE_MAX_BYTES: "65536"
  LLM_GATEWAY_AUDIT_BODY_CAPTURE_CLASSIFICATION: "restricted"
  LLM_GATEWAY_METER_BUDGET_CHECK_URL: ""
  LLM_GATEWAY_METER_BUDGET_STATUSES_URL: ""
  LLM_GATEWAY_METER_RECORD_USAGE_URL: ""
  LLM_GATEWAY_METER_RECORD_USAGE_MIRROR_URL: ""
  LLM_GATEWAY_METER_SERVICE_TOKEN: ""
  LLM_GATEWAY_METER_REQUEST_TIMEOUT: "5s"
  LLM_GATEWAY_BACKGROUND_MAX_IN_FLIGHT: "64"
  LLM_GATEWAY_BACKGROUND_DELIVERY_MAX_ATTEMPTS: "3"
  LLM_GATEWAY_BACKGROUND_DELIVERY_INITIAL_BACKOFF_MS: "100"
  LLM_GATEWAY_BACKGROUND_DELIVERY_MAX_BACKOFF_MS: "2000"
  LLM_GATEWAY_ADMISSION_MAX_IN_FLIGHT_REQUESTS: "0"
  LLM_GATEWAY_ADMISSION_MAX_ESTIMATED_TOKENS: "0"
  LLM_GATEWAY_RATE_LIMIT_ENABLED: "false"
  LLM_GATEWAY_RATE_LIMIT_RPS: "100"
  LLM_GATEWAY_RATE_LIMIT_RPM: ""
  LLM_GATEWAY_RATE_LIMIT_BURST: "200"
  LLM_GATEWAY_TOKEN_RATE_LIMIT_TPM: "120000"
  LLM_GATEWAY_TOKEN_RATE_LIMIT_BURST: "120000"
  LLM_GATEWAY_TOKEN_RATE_LIMIT_DEFAULT_OUTPUT_TOKENS: "1024"
  LLM_GATEWAY_DOWNSTREAM_BREAKER_FAILURE_THRESHOLD: ""
  LLM_GATEWAY_DOWNSTREAM_BREAKER_RESET_TIMEOUT: ""
  LLM_GATEWAY_DOWNSTREAM_BREAKER_HALF_OPEN_MAX: ""
  LLM_GATEWAY_IDENTITY_BREAKER_FAILURE_THRESHOLD: ""
  LLM_GATEWAY_IDENTITY_BREAKER_RESET_TIMEOUT: ""
  LLM_GATEWAY_IDENTITY_BREAKER_HALF_OPEN_MAX: ""
  LLM_GATEWAY_KEYS_BREAKER_FAILURE_THRESHOLD: ""
  LLM_GATEWAY_KEYS_BREAKER_RESET_TIMEOUT: ""
  LLM_GATEWAY_KEYS_BREAKER_HALF_OPEN_MAX: ""
  LLM_GATEWAY_PROMPTS_BREAKER_FAILURE_THRESHOLD: ""
  LLM_GATEWAY_PROMPTS_BREAKER_RESET_TIMEOUT: ""
  LLM_GATEWAY_PROMPTS_BREAKER_HALF_OPEN_MAX: ""
  LLM_GATEWAY_GOVERNANCE_BREAKER_FAILURE_THRESHOLD: ""
  LLM_GATEWAY_GOVERNANCE_BREAKER_RESET_TIMEOUT: ""
  LLM_GATEWAY_GOVERNANCE_BREAKER_HALF_OPEN_MAX: ""
  LLM_GATEWAY_AUDIT_BREAKER_FAILURE_THRESHOLD: ""
  LLM_GATEWAY_AUDIT_BREAKER_RESET_TIMEOUT: ""
  LLM_GATEWAY_AUDIT_BREAKER_HALF_OPEN_MAX: ""
  LLM_GATEWAY_METER_BUDGET_CHECK_BREAKER_FAILURE_THRESHOLD: ""
  LLM_GATEWAY_METER_BUDGET_CHECK_BREAKER_RESET_TIMEOUT: ""
  LLM_GATEWAY_METER_BUDGET_CHECK_BREAKER_HALF_OPEN_MAX: ""
  LLM_GATEWAY_METER_BUDGET_STATUS_BREAKER_FAILURE_THRESHOLD: ""
  LLM_GATEWAY_METER_BUDGET_STATUS_BREAKER_RESET_TIMEOUT: ""
  LLM_GATEWAY_METER_BUDGET_STATUS_BREAKER_HALF_OPEN_MAX: ""
  LLM_GATEWAY_METER_USAGE_BREAKER_FAILURE_THRESHOLD: ""
  LLM_GATEWAY_METER_USAGE_BREAKER_RESET_TIMEOUT: ""
  LLM_GATEWAY_METER_USAGE_BREAKER_HALF_OPEN_MAX: ""
  LLM_GATEWAY_EVAL_PIPELINE_URL: ""
  LLM_GATEWAY_TRAFFIC_SAMPLE_RATE: "0.01"
  LLM_GATEWAY_TRAFFIC_SAMPLE_MAX_BODY_BYTES: "65536"
  LLM_GATEWAY_PROVIDER_CREDENTIAL_VAULT: ""
  LLM_GATEWAY_SESSION_STORE: "postgres"
  LLM_GATEWAY_SESSIONS_DATABASE_URL: ""
  LLM_GATEWAY_SESSION_CAPTURE_BODIES: "false"
  LLM_GATEWAY_SESSION_CAPTURE_MAX_BODY_BYTES: "65536"
  LLM_GATEWAY_SESSION_FALLBACK_WINDOW: "30m"
  LLM_GATEWAY_TOKEN_BUDGET_ENABLED: "false"
  # Deprecated compatibility keys. The current Rust gateway treats token-budget
  # windows as process-local and ignores these legacy Redis settings; keep the
  # names present so existing Helm overrides do not disappear during upgrades.
  LLM_GATEWAY_TOKEN_BUDGET_REDIS_ADDR: ""
  LLM_GATEWAY_TOKEN_BUDGET_REDIS_PASSWORD: ""
  LLM_GATEWAY_TOKEN_BUDGET_REDIS_DB: "0"
  LLM_GATEWAY_TOKEN_BUDGET_KEY_PREFIX: "llm-gateway:token-budget:"
  LLM_GATEWAY_TOKEN_BUDGET_DAILY_TOKENS: "0"
  LLM_GATEWAY_TOKEN_BUDGET_MONTHLY_TOKENS: "0"
  LLM_GATEWAY_TOKEN_BUDGET_ORG_DAILY_TOKENS: ""
  LLM_GATEWAY_TOKEN_BUDGET_ORG_MONTHLY_TOKENS: ""
  LLM_GATEWAY_TOKEN_BUDGET_DEFAULT_OUTPUT_TOKEN_RESERVE: "1024"
  LLM_GATEWAY_RESPONSE_CACHE_ENABLED: "false"
  LLM_GATEWAY_RESPONSE_CACHE_TTL: "5m"
  LLM_GATEWAY_RESPONSE_CACHE_MAX_BODY_BYTES: "1048576"
  LLM_GATEWAY_RESPONSE_CACHE_MAX_BYTES: "268435456"
  LLM_GATEWAY_RESPONSE_CACHE_MAX_ENTRIES: "10000"
  LLM_GATEWAY_RESPONSE_SIGNING_ENABLED: "false"
  LLM_GATEWAY_RESPONSE_SIGNING_KEY_ID: ""
  LLM_GATEWAY_RESPONSE_SIGNING_SECRET: ""
  LLM_GATEWAY_ROUTING_CANARY_APPLY_ENABLED: "false"
  LLM_GATEWAY_ROUTING_CANARY_MAX_WEIGHT_DELTA_BPS: "1000"

secret:
  existingSecretName: ""
  rolloutChecksum: ""

# Both services must reference the same administrator-managed policy ConfigMap.
# Create it immutable; change its name and checksum for a policy rollout.
privateProviderEndpoints:
  enabled: false
  existingConfigMapName: ""
  rolloutChecksum: ""
