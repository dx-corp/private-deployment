{{- if .Values.privateProviderEndpoints.enabled -}}
{{- $_ := required "privateProviderEndpoints.existingConfigMapName is required" .Values.privateProviderEndpoints.existingConfigMapName -}}
{{- $_ := required "privateProviderEndpoints.rolloutChecksum is required" .Values.privateProviderEndpoints.rolloutChecksum -}}
{{- end -}}
{{- $listenAddr := lower (toString (get .Values.configEnv "LLM_GATEWAY_ADDR")) -}}
{{- $loopbackAddr := or (hasPrefix "127." $listenAddr) (eq $listenAddr "localhost") (hasPrefix "localhost:" $listenAddr) (hasPrefix "[::1]" $listenAddr) (eq $listenAddr "::1") (hasPrefix "0:0:0:0:0:0:0:1" $listenAddr) (contains ":ffff:127." $listenAddr) -}}
{{- $portAligned := or (eq $listenAddr ":8080") (hasSuffix ":8080" $listenAddr) -}}
{{- if or $loopbackAddr (not $portAligned) -}}
{{- fail "configEnv.LLM_GATEWAY_ADDR must bind a non-loopback address on port 8080 for Kubernetes probes; use 0.0.0.0:8080 or :8080" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "llm-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.privateProviderEndpoints.enabled }}
        checksum/private-provider-endpoints: {{ .Values.privateProviderEndpoints.rolloutChecksum | quote }}
        {{- end }}
        {{- if not .Values.secret.existingSecretName }}
        checksum/llm-gateway-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.secret.rolloutChecksum }}
        checksum/external-secret: {{ .Values.secret.rolloutChecksum | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "llm-gateway.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "llm-gateway.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "llm-gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if .Values.privateProviderEndpoints.enabled }}
            - name: LLM_GATEWAY_PRIVATE_PROVIDER_ENDPOINTS_FILE
              value: /etc/deixic/private-provider-endpoints/policy.json
            {{- end }}
            {{- range $key, $value := .Values.configEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.featureFlags.enabled }}
            - name: EVALOPS_FEATURE_FLAGS_PATH
              value: "{{ .Values.featureFlags.mountPath }}/{{ .Values.featureFlags.fileName }}"
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "llm-gateway.secretName" . }}
          {{- if or .Values.featureFlags.enabled .Values.privateProviderEndpoints.enabled }}
          volumeMounts:
            {{- if .Values.privateProviderEndpoints.enabled }}
            - name: private-provider-endpoints
              mountPath: /etc/deixic/private-provider-endpoints
              readOnly: true
            {{- end }}
            {{- if .Values.featureFlags.enabled }}
            - name: feature-flags
              mountPath: {{ .Values.featureFlags.mountPath }}
              readOnly: true
          {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.featureFlags.enabled .Values.privateProviderEndpoints.enabled }}
      volumes:
        {{- if .Values.privateProviderEndpoints.enabled }}
        - name: private-provider-endpoints
          configMap:
            name: {{ .Values.privateProviderEndpoints.existingConfigMapName | quote }}
            items:
              - key: policy.json
                path: policy.json
        {{- end }}
        {{- if .Values.featureFlags.enabled }}
        - name: feature-flags
          configMap:
            name: {{ required "featureFlags.existingConfigMapName is required when featureFlags.enabled=true" .Values.featureFlags.existingConfigMapName }}
      {{- end }}
      {{- end }}
