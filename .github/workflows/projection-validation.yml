name: Projection validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test projection state gate
        run: bash .github/scripts/inspect-projection-state.test.sh
      - name: Inspect projection state
        id: projection
        env:
          PROJECTION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/inspect-projection-state.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.projection.outputs.present == 'true'
        with:
          node-version: 22.23.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.projection.outputs.present == 'true'
        with:
          version: v3.16.3
      - name: Validate the projected distribution
        if: steps.projection.outputs.present == 'true'
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/private-deployment-projection"
          mkdir -p "$tree"
          git archive --format=tar HEAD | tar -xf - -C "$tree"
          test -f "$tree/LICENSE"
          test -f "$tree/scripts/distribution-validation.mjs"
          helm version --short
          node "$tree/scripts/distribution-validation.mjs" --name private-deployment --target "$tree"
